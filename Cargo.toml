[package]
name = "quiver"
version = "0.3.1"
edition = "2021"
rust-version = "1.70"
authors = ["The Quiver Authors"]
description = "A seekable, self-describing binary archive container format: reader, writer, index, and block codecs."
documentation = "https://docs.rs/quiver"
repository = "https://github.com/quiver-archive/quiver"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["archive", "container", "compression", "parser", "format"]
categories = ["parsing", "encoding", "filesystem"]

[lib]
name = "quiver"
path = "src/lib.rs"

[features]
default = ["std"]
std = []
# Extra internal consistency checks in the codecs and readers; off by default
# because they only matter when chasing a format bug.
strict = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3

[[example]]
name = "pack"
path = "examples/pack.rs"

[[example]]
name = "list"
path = "examples/list.rs"

[[example]]
name = "hexdump"
path = "examples/hexdump.rs"

[[example]]
name = "hostile"
path = "examples/hostile.rs"

[[example]]
name = "fuzz_smoke"
path = "examples/fuzz_smoke.rs"

[[bench]]
name = "codec"
path = "benches/codec.rs"
harness = false
